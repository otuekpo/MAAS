<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Password Reset OTP</title>
  </head>
  <body style="font-family: Arial, sans-serif; background-color: #ffffff; color: #000000; margin: 0; padding: 20px;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; margin: auto; background-color: #ffffff; padding: 20px; border: 1px solid #000000;">
      <tr>
        <td>
          <h2 style="margin-bottom: 20px;">Hello {{userName}},</h2>
          <p>You requested to reset your password. Use the OTP code below to proceed:</p>
        </td>
      </tr>
      <tr>
        <td style="text-align: center; padding: 30px 0;">
          <div style="font-size: 32px; font-weight: bold; border: 1px solid #000000; padding: 16px; display: inline-block; letter-spacing: 4px;">
            {{otpCode}}
          </div>
        </td>
      </tr>
      <tr>
        <td>
          <p>This OTP is valid for {{otpExpiryMinutes}} minutes.</p>
          <p>If you didn’t request this, please ignore this email or contact support.</p>
          <a href="mailto:{{contactEmail}}">{{contactEmail}}</a>
        </td>
      </tr>
      <tr>
        <td style="padding-top: 30px; font-size: 12px; text-align: center; border-top: 1px solid #000000;">
          <p>© ChatDevz. All rights reserved.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
