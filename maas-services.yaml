# DMZ topology:
#   maas-dmz       - public-facing network. Only services that must be
#                    reachable from the internet publish host ports.
#   maas-internal  - isolated network with NO published ports. Databases,
#                    caches, and admin tools live here and are unreachable
#                    from the host/internet. App services are dual-homed so
#                    they can reach internal resources by service name.
services:

  # POSTGRES (internal only)
  postgres:
    image: "postgres:latest" #18
    networks:
      - maas-internal
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: default_database
    volumes:
      - ./pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d default_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MONGODB (internal only)
  mongodb:
      image: mongodb/mongodb-atlas-local
      networks:
        - maas-internal
      hostname: mongodb
      environment:
        - MONGODB_INITDB_ROOT_USERNAME=user
        - MONGODB_INITDB_ROOT_PASSWORD=pass
      volumes:
        - ./init:/docker-entrypoint-initdb.d
        - mongodb_data:/data/db
        - mongodb_configdb:/data/configdb
        - mongodb_mongot:/data/mongot
      healthcheck:
        test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet


  # MONGODB CLIENT (admin tool, internal only)
  mongo-express:
    container_name: mongo-express
    image: mongo-express
    networks:
      - maas-internal
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=password
    volumes:
      - ./mongo-data:/data/db

  # REDIS (internal only)
  redis:
    image: redis:7-alpine
    networks:
      - maas-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MAAS SERVER (DMZ: public API, dual-homed to internal network)
  maas-server:
    build:
      context: ./maas-server
      dockerfile: Dockerfile
    networks:
      - maas-dmz
      - maas-internal
    ports:
      - "4081:4081"
    environment:
      DATABASE_URL: postgresql://username:password@postgres:5432/default_database
      MONGODB_URI: mongodb://user:pass@mongodb:27017/?authSource=admin    
      REDIS_URL: redis://redis:6379/15  
    env_file:
      - ./maas-server/.env
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # INJESTION SERVICE (DMZ: public sensor ingest, dual-homed to internal)
  injestion:
    build:
      context: ./maas-server
      dockerfile: Dockerfile.injestion
    networks:
      - maas-dmz
      - maas-internal
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://username:password@postgres:5432/default_database
      MONGODB_URI: mongodb://user:pass@mongodb:27017/?authSource=admin
      REDIS_URL: redis://redis:6379/15
    env_file:
      - ./maas-server/.env
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb_data:
  mongodb_configdb:
  mongodb_mongot:
  # configdb:
  # mongot:
  pg-data:

networks:
  # Public-facing zone. Only DMZ services attach here and publish host ports.
  maas-dmz:
    driver: bridge
  # Isolated zone. No published ports; reachable only by dual-homed DMZ apps.
  maas-internal:
    driver: bridge
